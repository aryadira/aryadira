<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="312" viewBox="0 0 840 312" fill="none">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
  .up { opacity: 0; animation: up .7s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .rule { stroke-dasharray: 840; stroke-dashoffset: 840; animation: draw 1.2s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .lbl { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; fill: #71717a; }

  .role { font-size: 18px; font-weight: 600; letter-spacing: -.3px; fill: #f4f4f5; }
  .co { font-size: 15px; font-weight: 450; fill: #a1a1aa; }
  .when { font-size: 13px; font-weight: 500; fill: #71717a; letter-spacing: .2px; }
  .num { font-size: 40px; font-weight: 650; letter-spacing: -1.6px; fill: #f4f4f5; }
  .cap { font-size: 13px; font-weight: 500; fill: #a1a1aa; }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: .5; } 75%, 100% { transform: scale(2.8); opacity: 0; } }

</style>
<g class="up">
  <text class="lbl" x="0" y="14"><tspan fill="#a78bfa">01</tspan><tspan dx="10">NOW</tspan></text>
</g>
<g class="up" style="animation-delay:0.15s">
  <circle class="ping" cx="5" cy="50" r="4" fill="#4ade80" style="animation-delay:0.0s" />
  <circle cx="5" cy="50" r="4" fill="#4ade80" />
  <text class="role" x="24" y="56">Junior Software Developer</text>
  <text class="co" x="24" y="78">adw consulting <tspan fill="#71717a">· Contract</tspan></text>
  <text class="when" x="840" y="56" text-anchor="end">Jun 2025 — now</text>
</g>
<line class="rule" x1="0" y1="92.5" x2="840" y2="92.5" stroke="#27272a" style="animation-delay:0.35s" />
<g class="up" style="animation-delay:0.27s">
  <circle class="ping" cx="5" cy="108" r="4" fill="#4ade80" style="animation-delay:0.6s" />
  <circle cx="5" cy="108" r="4" fill="#4ade80" />
  <text class="role" x="24" y="114">Frontend Engineer</text>
  <text class="co" x="24" y="136">Abadikan <tspan fill="#71717a">· Part-time</tspan></text>
  <text class="when" x="840" y="114" text-anchor="end">May 2025 — now</text>
</g>
<line class="rule" x1="0" y1="150.5" x2="840" y2="150.5" stroke="#27272a" style="animation-delay:0.47s" />
<g class="up" style="animation-delay:0.39s">
  <circle class="ping" cx="5" cy="166" r="4" fill="#4ade80" style="animation-delay:1.2s" />
  <circle cx="5" cy="166" r="4" fill="#4ade80" />
  <text class="role" x="24" y="172">Web Designer</text>
  <text class="co" x="24" y="194">RAF-Studio <tspan fill="#71717a">· Freelance</tspan></text>
  <text class="when" x="840" y="172" text-anchor="end">Jul 2024 — now</text>
</g>
<line class="rule" x1="0" y1="208.5" x2="840" y2="208.5" stroke="#27272a" style="animation-delay:0.59s" />
<g class="up" style="animation-delay:0.60s">
  <text class="num" x="0.0" y="276">3+</text>
  <text class="cap" x="2.0" y="300">years experience</text>
</g>
<g class="up" style="animation-delay:0.70s">
  <text class="num" x="210.0" y="276">15+</text>
  <text class="cap" x="212.0" y="300">projects shipped</text>
</g>
<g class="up" style="animation-delay:0.80s">
  <text class="num" x="420.0" y="276">10+</text>
  <text class="cap" x="422.0" y="300">happy clients</text>
</g>
<g class="up" style="animation-delay:0.90s">
  <text class="num" x="630.0" y="276">12</text>
  <text class="cap" x="632.0" y="300">peaks climbed</text>
</g>
</svg>
